[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trpg-retrieval"
version = "0.1.0"
description = "Retrieval service for TrpgRuleAgent"
requires-python = ">=3.8"

[project.optional-dependencies]
vector = [
  "chromadb==1.5.9",
  "fastembed==0.7.4",
  "numpy==1.26.4",
  "urllib3==1.26.20"
]

[tool.setuptools.packages.find]
where = ["src"]
